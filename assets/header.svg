<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#080C1B"/>
    </linearGradient>

    <!-- Neon Cyan to Magenta Wave Gradient -->
    <linearGradient id="neonWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#7928CA;#FF007F;#00F2FE" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#FF007F;#00F2FE;#7928CA" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF007F">
        <animate attributeName="stop-color" values="#FF007F;#00F2FE;#7928CA;#FF007F" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Secondary Wave Gradient -->
    <linearGradient id="neonWave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Cyber Matrix Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F2FE" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1" fill="#00F2FE" fill-opacity="0.2"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#7928CA" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 48px;
      letter-spacing: 6px;
      fill: #FFFFFF;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 3.5px;
      fill: #00F2FE;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #00FF66;
    }
    .bracket {
      font-family: monospace;
      font-size: 22px;
      fill: #FF007F;
      opacity: 0.8;
    }
  </style>

  <!-- Container Box with Rounded Borders & Glow -->
  <rect width="900" height="220" rx="14" fill="url(#bgGrad)" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect width="900" height="220" rx="14" fill="url(#cyberGrid)" />

  <!-- Animated Ambient Waves -->
  <path opacity="0.35" fill="url(#neonWave2)">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
      values="
        M0,170 Q225,130 450,170 T900,160 L900,220 L0,220 Z;
        M0,160 Q225,185 450,150 T900,175 L900,220 L0,220 Z;
        M0,170 Q225,130 450,170 T900,160 L900,220 L0,220 Z
      " />
  </path>

  <path opacity="0.25" fill="url(#neonWave1)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="
        M0,185 Q225,150 450,190 T900,170 L900,220 L0,220 Z;
        M0,175 Q225,195 450,165 T900,185 L900,220 L0,220 Z;
        M0,185 Q225,150 450,190 T900,170 L900,220 L0,220 Z
      " />
  </path>

  <!-- Glowing Bottom Accent Line -->
  <line x1="0" y1="219" x2="900" y2="219" stroke="url(#neonWave1)" stroke-width="2.5" />

  <!-- Cyber HUD Decorative Accents -->
  <!-- Top Left HUD -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.8"/>
  <circle cx="20" cy="20" r="3" fill="#00F2FE" filter="url(#neonGlowCyan)"/>
  
  <!-- Top Right HUD -->
  <path d="M 880 40 L 880 20 L 860 20" stroke="#FF007F" stroke-width="2" fill="none" opacity="0.8"/>
  <circle cx="880" cy="20" r="3" fill="#FF007F"/>

  <!-- Status Indicator Badge (Top Center) -->
  <g transform="translate(370, 24)">
    <rect width="160" height="22" rx="11" fill="#0D1628" stroke="#00FF66" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="11" r="4" fill="#00FF66">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="15" class="badge-text">SYSTEM ONLINE</text>
  </g>

  <!-- Center Title & Typography -->
  <g filter="url(#textGlow)">
    <text x="450" y="112" text-anchor="middle" class="title">DARSHAN PRAJAPATI</text>
  </g>

  <!-- Decorative Cyber Brackets -->
  <text x="110" y="110" text-anchor="middle" class="bracket">&lt;CODE&gt;</text>
  <text x="790" y="110" text-anchor="middle" class="bracket">&lt;/DEV&gt;</text>

  <!-- Subtitle -->
  <g filter="url(#neonGlowCyan)">
    <text x="450" y="152" text-anchor="middle" class="subtitle">⚡ FULL STACK DEVELOPER • DISTRIBUTED SYSTEMS • APPLIED AI ⚡</text>
  </g>

  <!-- Bottom Dots / Tech Metric Decor -->
  <g opacity="0.5">
    <circle cx="430" cy="178" r="2" fill="#00F2FE"/>
    <circle cx="450" cy="178" r="2.5" fill="#FF007F"/>
    <circle cx="470" cy="178" r="2" fill="#00F2FE"/>
  </g>
</svg>
