<svg width="100%" height="90" viewBox="0 0 900 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#7928CA;#FF007F;#00F2FE" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#FF007F;#00F2FE;#7928CA" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF007F">
        <animate attributeName="stop-color" values="#FF007F;#00F2FE;#7928CA;#FF007F" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="footerBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1224" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Animated Neon Waving Waves -->
  <path fill="url(#footerNeon)" opacity="0.35">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="
        M0,45 Q225,10 450,45 T900,35 L900,90 L0,90 Z;
        M0,35 Q225,65 450,25 T900,50 L900,90 L0,90 Z;
        M0,45 Q225,10 450,45 T900,35 L900,90 L0,90 Z
      " />
  </path>

  <path fill="url(#footerNeon)" opacity="0.2">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M0,25 Q225,55 450,20 T900,40 L900,90 L0,90 Z;
        M0,40 Q225,15 450,50 T900,25 L900,90 L0,90 Z;
        M0,25 Q225,55 450,20 T900,40 L900,90 L0,90 Z
      " />
  </path>

  <!-- Top Accent Glowing Border Line -->
  <line x1="0" y1="1" x2="900" y2="1" stroke="url(#footerNeon)" stroke-width="2" opacity="0.8"/>
</svg>
